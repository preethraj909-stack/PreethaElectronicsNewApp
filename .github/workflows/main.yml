
name: Build Preetha Electronics APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project ZIP
        run: |
          mkdir -p build-project
          ZIP_FILE=$(find . -maxdepth 1 -name 'PreethaElectronicsStarter*.zip' | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "Project ZIP not found!"
            exit 1
          fi
          unzip -o "$ZIP_FILE" -d build-project

      - name: Build APK
        run: |
          PROJECT_DIR=$(find build-project -name settings.gradle -printf '%h\n' | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            echo "Android project not found!"
            exit 1
          fi
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Preetha-Electronics-APK
          path: build-project/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
